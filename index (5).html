<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:"Times New Roman",Times,"Liberation Serif","Noto Serif",serif;font-size:17px;color:#3b0764;background:#fdf4ff;background-image:repeating-linear-gradient(135deg,rgba(168,85,247,.09) 0 6px,transparent 6px 12px),repeating-linear-gradient(45deg,rgba(236,72,153,.09) 0 6px,transparent 6px 12px);min-height:100vh}

button,input,select,table{font-family:inherit}
body{background-color:#fdf4ff;background-image:radial-gradient(circle at 20% 15%,rgba(236,72,153,.12) 0 60px,transparent 61px),radial-gradient(circle at 85% 70%,rgba(34,197,94,.12) 0 70px,transparent 71px),repeating-linear-gradient(90deg,rgba(124,58,237,.07) 0 3px,transparent 3px 8px),repeating-linear-gradient(0deg,rgba(236,72,153,.07) 0 3px,transparent 3px 8px)}

<script>

function overlay(p){const c=S.cur;if(!c||c.pid!==p.id||c.stage==='cell')return'';const cf=S.cfg;let h='';

function fx(){const c=$('#fx'),x=c.getContext('2d'),cols=['#fbbf24','#ec4899','#a855f7','#22c55e','#38bdf8','#f97316'];c.width=innerWidth;c.height=innerHeight;fxOn=1;parts=[];let last=0;
(function lp(t){if(!fxOn){x.clearRect(0,0,c.width,c.height);return}x.clearRect(0,0,c.width,c.height);if(t-last>500){last=t;const cx=Math.random()*c.width,cy=Math.random()*c.height*.5+40,cl=pick(cols);for(let i=0;i<60;i++){const a=Math.random()*6.28,s=Math.random()*5+2;parts.push({x:cx,y:cy,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:70,c:cl,t:0})}for(let i=0;i<6;i++)parts.push({x:Math.random()*c.width,y:-10,vx:Math.random()*2-1,vy:Math.random()*3+2,l:240,c:pick(cols),t:1})}
parts=parts.filter(p=>p.l>0);parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;if(!p.t)p.vy+=.06;p.l--;x.globalAlpha=Math.min(1,p.l/30);x.fillStyle=p.c;x.fillRect(p.x,p.y,p.t?9:4,p.t?5:4)});requestAnimationFrame(lp)})(0)}

<p>Ақылы өту төлемі, % : <input type="number" style="width:80px" value="${c.skipPct}" onchange="A.cn('skipPct',this.value)"></p><p>Бонус мөлшерлері: <input value="${c.bonus.join(',')}" onchange="A.cl('bonus',this.value)"></p><p>Шығын мөлшерлері: <input value="${c.loss.join(',')}" onchange="A.cl('loss',this.value)"></p>
<p>Инвестиция салым / қайтарым: <input type="number" style="width:80px" value="${c.invIn}" onchange="A.cn('invIn',this.value)"> <input type="number" style="width:80px" value="${c.invOut}" onchange="A.cn('invOut',this.value)"></p><p>Финиш бонусы: <input type="number" style="width:80px" value="${c.fin}" onchange="A.cn('fin',this.value)"> Бір жүріс = қадам: <input type="number" min="1" max="10" style="width:60px" value="${c.step}" onchange="A.cn('step',Math.max(1,this.value))"> Топтан көмек сыйақысы, %: <input type="number" style="width:70px" value="${c.helpPct}" onchange="A.cn('helpPct',this.value)"></p>
<p><label><input type="checkbox" ${c.neg?'checked':''} onchange="A.cb('neg',this.checked)"> Теріс балансқа рұқсат</label></p><p><label><input type="checkbox" ${c.withdraw?'checked':''} onchange="A.cb('withdraw',this.checked)"> Жинақтан шешіп алуға рұқсат (әдепкіде өшірулі)</label></p><p>Тең нәтиже кезіндегі қосымша ереже: <input value="${e(c.tie)}" onchange="S.cfg.tie=this.value;save();R()" style="width:100%"></p></div>`}
/* ---------- actions ---------- */
function R(){const p=me();if(S.status==='end'&&(V==='game'||V==='final'))V='final';if(V==='final'&&S.status!=='end')V=ADM?'admin':'home';if(V==='game'&&!p)V='home';if(V==='admin'&&!ADM)V='home';
$('#app').innerHTML={home,sel,game,admin,final}[V]();if(V==='final'){if(!fxOn)fx()}else fxOn=0;
if(V==='game'&&S.cur&&S.cur.stage==='cell'&&!anim&&!rolling&&p&&S.cur.pid===p.id)openCell()}
A.part=()=>{SEL={g:null,p:null};V='sel';R()};A.sg=g=>{SEL={g,p:'t'+g};R()};A.sp=id=>{SEL.p=id;R()};
A.go=()=>{if(!SEL.p)return;localStorage.setItem(KM,SEL.p);S.P[SEL.p].joined=1;save();V='game';R()};
A.out=()=>{localStorage.removeItem(KM);V='home';R()};A.adm=()=>askAdmin(()=>{ADM=true;sessionStorage.setItem('asykadm','1');V='admin';R()});A.aout=()=>{ADM=false;sessionStorage.removeItem('asykadm');V='home';R()};
A.info=i=>{const c=S.cfg,R_={S:`Старт. Мақсат — 🏆 финишке жету (+${f(c.fin)}).`,q:`СҰРАҚ: дұрыс жауап = сыйақы + 1 қадам.`,l:'ЛОГИКА: күрделірек сұрақ, дұрыс жауап = сыйақы + 1 қадам.',b:`БОНУС: қонғанда кездейсоқ ${c.bonus.map(f).join(' / ')} ұтыс.`,s:`ШЫҒЫН: қонғанда кездейсоқ ${c.loss.map(f).join(' / ')} жоғалту (баланс теріс болмайды).`,i:'ИНФОРМАТИКА: Excel, кесте, диаграмма сұрақтары.',p:`АҚЫЛЫ ӨТУ: сұраққа төлеп өтуге болады (${c.skipPct}%); бұл ұяшықта келесі өту 50% жеңіл.`,v:`ИНВЕСТИЦИЯ: ${f(c.invIn)} сал, келесі дұрыс жауапқа +${f(c.invOut)} қайтады.`,x:'ЕРЕКШЕ: тегін өту немесе бонус.',F:'🏆 ФИНИШ: мәреге жеткен ойыншы бонус алады.'};
dlg(i<0?'Ереже':cd(i)[0]+' '+cd(i)[1],i<0?Object.values(R_).map(x=>`<p>${x}</p>`).join(''):`<p>${R_[i===35?'F':MAP[i]]}</p>`,[['Жабу',null]])};
A.start=()=>{const p=me();if(!p||S.status!=='run'||S.cur||p.fin||turnPid()!==p.id)return;S.cur={pid:p.id,stage:'q'};task(MAP[Math.min(p.pos+1,35)]);R()};
function fin(msg,amt){S.cur.stage='res';S.cur.res={msg,amt};save()}
function endTurn(){S.cur=null;S.turn++;confirmSkip=0;if(!order().length)S.status='end';save();R()}
function openCell(){const c=S.cur;if(!c||c.stage!=='cell')return;const p=S.P[c.pid],t=MAP[p.pos],cf=S.cfg;
if(p.pos>=35){p.fin=Date.now();money(p.id,cf.fin,'Финишке жетті','fin');fin('🏆 ФИНИШ! Асық мәреге жетті! +'+f(cf.fin)+' 🎉',cf.fin)}
else if(t==='b'){const a=pick(cf.bonus);money(p.id,a,'Бонус ұяшығы','bonus');fin('🎁 БОНУС! +'+f(a)+' 🎉',a)}
else if(t==='s'){const a=money(p.id,-pick(cf.loss),'Шығын ұяшығы','loss');fin('💸 ШЫҒЫН! '+f(a),a)}
else if(t==='v'){c.stage='inv';save()}
else if(t==='x'){const r=Math.floor(Math.random()*3);if(r===0){p.free++;fin('⭐ ЕРЕКШЕ: 1 рет тегін өту алдың!',0)}else{const a=r===1?1000:500;money(p.id,a,'Ерекше мүмкіндік бонусы','bonus');fin('⭐ ЕРЕКШЕ: +'+f(a)+' бонус!',a)}}
else if(t==='p'){p.cheap=1;fin('🪙 АҚЫЛЫ ӨТУ ұяшығы: келесі сұрақта өту төлемі 50% жеңіл!',0)}
else{endTurn();return}R()}
const avail=ss=>QS.filter(q=>ss.includes(q.s)&&!S.qoff[q.n]&&!S.used.includes(q.n));
function task(t){const c=S.cur,ss={q:[1],l:[2,5],i:[3],p:[1,2,3,4,5],x:[4]}[t]||[1,2,3,4,5];let pool=avail(ss);if(!pool.length)pool=avail([1,2,3,4,5]);if(!pool.length&&S.cfg.reuse){S.used=[];pool=avail(ss);if(!pool.length)pool=avail([1,2,3,4,5])}
if(!pool.length){fin('Қолжетімді сұрақ қалмады. Админ сұрақтарды қайта қолдануға рұқсат беруі керек.',0);return}c.task={qn:pick(pool).n};c.stage='q';save()}
A.inv=()=>{const c=S.cur,p=me();if(!c||c.stage!=='inv'||c.pid!==p.id)return;if(!S.cfg.neg&&p.cash<S.cfg.invIn)return;money(p.id,-S.cfg.invIn,'Инвестиция салымы','inv');p.inv=1;fin('📈 Инвестицияландың! Келесі дұрыс жауапқа +'+f(S.cfg.invOut)+' қосымша қайтады.',-S.cfg.invIn);R()};
A.noinv=()=>{if(S.cur&&S.cur.stage==='inv'){fin('Инвестициядан бас тарттың.',0);R()}};
A.help=()=>{const c=S.cur,p=me();if(!c||c.stage!=='q'||c.pid!==p.id||c.task.help)return;c.task.help=1;save();R()};
A.ans=i=>{const c=S.cur,p=me();if(!c||c.stage!=='q'||c.pid!==p.id)return;const q=QS[c.task.qn-1],ok=i===q.a,P=S.P[p.id];let amt=0,msg;
S.used.push(q.n);P.done++;ok?P.right++:P.wrong++;
if(ok){amt=c.task.help?Math.round(price(q.n)*S.cfg.helpPct/100):price(q.n);money(p.id,amt,'Дұрыс жауап №'+q.n+(c.task.help?' (топ көмегімен)':''),'ans');msg=`ДҰРЫС ЖАУАП! +${amt} ₸ 🎉 Асық алға жүреді!`;if(P.inv){money(p.id,S.cfg.invOut,'Инвестиция қайтарымы','inv');msg+=` Инвестиция: +${S.cfg.invOut} ₸`}}
else{msg='ҚАТЕ ЖАУАП. Бұл жолы ақша ұтпадың, асық орнында қалады!';if(P.inv)msg+=' Инвестиция жоғалды.'}
P.inv=0;S.hist.push({t:Date.now(),pid:p.id,qn:q.n,ok,round:S.round});c.stage='res';c.res={ok,msg,amt,pick:i,cor:q.a,qn:q.n,move:ok};confirmSkip=0;save();R()};
A.skipOk=()=>{const c=S.cur,p=me();if(!c||c.stage!=='q'||c.pid!==p.id)return;const q=QS[c.task.qn-1],P=S.P[p.id];let fee=skipFee(q.n,P);
if(P.free>0){P.free--;fee=0}else{if(!S.cfg.neg&&P.cash<fee){alert('Ақша жеткіліксіз');return}money(p.id,-fee,'Ақылы өту №'+q.n,'skip');P.cheap=0}
S.used.push(q.n);P.done++;confirmSkip=0;c.stage='res';c.res={msg:`Тапсырма өткізілді. ${fee?'Төленді: '+f(fee):'Тегін өту қолданылды'}. Асық ${S.cfg.step} қадам алға жүреді (дұрыс жауап болып есептелмейді).`,amt:-fee,move:1};save();R()};
A.ok=()=>{const c=S.cur,p=me();if(!c||c.stage!=='res'||c.pid!==p.id)return;
if(c.res.move&&!c.moved){c.moved=1;c.res.move=0;const P=S.P[p.id],from=P.pos;P.pos=Math.min(35,from+S.cfg.step);c.stage='cell';S.last={pid:p.id,pos:P.pos};save();anim={pid:p.id,pos:from};R();setTimeout(()=>{anim=null;openCell()},600);return}
endTurn()};
A.an=()=>{S.cur=null;S.turn++;save();R()};A.at=()=>{const i=order().indexOf($('#tp').value);if(i>=0){S.turn=i;S.cur=null;save();R()}};
A.sv=()=>{const p=me();dlg('🏦 Жинаққа салу',`<p>Қолжетімді: ${f(p.cash)} · Жинақта: ${f(p.sav)}</p><p>Жинақтағы ақша жалпы байлыққа кіреді, бірақ ақылы өтуге жұмсалмайды.</p><input id="am" type="number" min="1" style="width:100%" placeholder="Сома ₸">`,[['Салу',m=>{const a=Math.floor(+m.querySelector('#am').value);const q=me();if(!(a>0)||a>q.cash){alert('Сома қате немесе ақша жеткіліксіз');return false}q.cash-=a;q.sav+=a;S.tx.push({t:Date.now(),pid:q.id,a:-a,reason:'Жинаққа салынды',kind:'sav',bal:q.cash});save();R()}],['Болдырмау',null,'gr']])};
A.wd=()=>{const p=me();dlg('Жинақтан алу',`<p>Жинақта: ${f(p.sav)}</p><input id="am" type="number" min="1" style="width:100%" placeholder="Сома ₸">`,[['Алу',m=>{const a=Math.floor(+m.querySelector('#am').value),q=me();if(!(a>0)||a>q.sav){alert('Сома қате');return false}q.sav-=a;q.cash+=a;S.tx.push({t:Date.now(),pid:q.id,a,reason:'Жинақтан алынды',kind:'wd',bal:q.cash});save();R()}],['Болдырмау',null,'gr']])};
A.mon=sg=>{const pid=$('#mp').value,a=Math.floor(+$('#ma').value),rs=$('#mr').value.trim();if(!(a>0)){alert('Соманы енгізіңіз');return}if(!rs){alert('Себебін жазыңыз');return}money(pid,sg*a,'Админ: '+rs,'admin');save();R()};
A.setb=all=>{const a=Math.floor(+$('#ma').value);if(!(a>=0)||$('#ma').value===''){alert('Соманы енгізіңіз');return}const ids=all?Object.keys(S.P):[$('#mp').value];if(all&&!confirm('Барлық ойыншыға '+a+' ₸ орнатылсын ба?'))return;ids.forEach(id=>{const p=S.P[id];S.tx.push({t:Date.now(),pid:id,a:a-p.cash,reason:'Бастапқы баланс орнатылды',kind:'init',bal:a});p.cash=a});save();R()};
A.qt=n=>{S.qoff[n]?delete S.qoff[n]:S.qoff[n]=1;save();R()};A.qpr=(n,v)=>{v=+v;if(v>=0)S.qp[n]=Math.round(v);save();R()};
A.qa=n=>{const q=QS[n-1];dlg('№'+n+' · '+LVN[LV(q.s)],`<p><b>${e(q.q)}</b></p>${optsHTML(q,0,{cor:q.a,pick:-1})}<p>Бөлім: ${SEC[q.s-1]}<br>Баға: ${f(price(n))}${CHK[n]?'<br>⚠ '+CHK[n]:''}</p>`,[['Жабу',null]])};
A.gs=s=>{if(s==='run'){S.status='run'}else if(s==='pause')S.status='pause';else if(s==='round'){S.round++;S.turn=0;S.cur=null;S.status='pause'}else if(s==='end'){S.cur=null;S.status='end';V='final'}save();R()};
A.cp=(i,v)=>{v=+v;if(v>=0){S.cfg.prize[i]=Math.round(v);save()}R()};A.cn=(k,v)=>{v=+v;if(v>=0){S.cfg[k]=Math.round(v);save()}R()};A.cl=(k,v)=>{const a=v.split(',').map(x=>Math.round(+x.trim())).filter(x=>x>0);if(a.length){S.cfg[k]=a;save()}R()};A.cb=(k,v)=>{S.cfg[k]=v;save()};
A.reuse=()=>{const left=QS.filter(q=>!S.qoff[q.n]&&!S.used.includes(q.n)).length;if(!S.cfg.reuse&&left>0){alert('Қайта қолдануға тек барлық сұрақ аяқталғанда рұқсат беріледі. Қалды: '+left);return}S.cfg.reuse=!S.cfg.reuse;save();R()};
function rows(s){const out=[['Орын','Топ','Қатысушы','Қолжетімді ақша','Жинақ','Жалпы байлық','Дұрыс','Қате','Тапсырма']];const o=s===S?ranked():s.teams;if(s===S){o.forEach(t=>{t.ps.forEach(p=>out.push([t.rank,t.name,TEAMS[t.g][2].join('; '),p.cash,p.sav,wealth(p),p.right,p.wrong,p.done]));})}else return s.rows;return out}
function csvTxt(r){return '\ufeff'+r.map(x=>x.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n')}
function dl(n,t){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/csv;charset=utf-8'}));a.download=n;a.click()}
A.csv=()=>dl('asyk-flow-nətije.csv',csvTxt(rows(S)));A.acsv=i=>dl('asyk-flow-arhiv-'+(i+1)+'.csv',csvTxt(S.archive[i].rows));A.adel=i=>dlg('Архивті өшіру','Бұл әрекетті қайтару мүмкін емес. Өшіру керек пе?',[['Өшіру',()=>{S.archive.splice(i,1);save();R()},'r'],['Болдырмау',null,'gr']]);
function snap(){return{t:Date.now(),rows:rows(S),teams:ranked().map(t=>({name:t.name,tot:t.tot}))}}
A.newS=()=>askAdmin(()=>setTimeout(()=>dlg('Жаңа ойын сессиясы','Алдыңғы ойынның нәтижелерімен не істейміз?',[['Архивтеп бастау',()=>{const a=S.archive.concat([snap()]);S=fresh({cfg:S.cfg,qp:S.qp,qoff:S.qoff,archive:a});save();localStorage.removeItem(KM);V=ADM?'admin':'home';fxOn=0;R()},'g'],['Архивсіз бастау (өшіру)',()=>{S=fresh({cfg:S.cfg,qp:S.qp,qoff:S.qoff,archive:S.archive});save();localStorage.removeItem(KM);V=ADM?'admin':'home';R()},'r'],['Болдырмау',null,'gr']]),50));
A.wipe=()=>dlg('⚠ Толық тазарту','Барлық ойыншы, ақша, тарих, архив және баптау өшіріледі. Растайсыз ба?',[['Иә, тазарту',()=>{localStorage.removeItem(K);localStorage.removeItem(KM);S=fresh();save();V='admin';R()},'r'],['Болдырмау',null,'gr']]);
addEventListener('storage',ev=>{if(ev.key===K&&!$('#mod').innerHTML&&!anim&&!rolling){S=load();R()}});
R();
</script></body></html>
